<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0f1115" />
  <meta name="description" content="Quản lý tài chính cá nhân" />
  <title>Quản lý Tài chính</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
  <script src="https://unpkg.com/dexie@3.2.7/dist/dexie.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3.0.0/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
</head>
<body>
  <div id="app">
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-header">
        <div class="logo">
          <span class="logo-mark">T</span>
          <span class="logo-text">Tài chính</span>
        </div>
        <button id="sidebar-toggle" class="icon-btn" aria-label="Đóng menu">✕</button>
      </div>
      <nav class="sidebar-nav">
        <a href="#dashboard" class="nav-item active" data-page="dashboard">
          <span class="nav-icon">▣</span><span>Tổng quan</span>
        </a>
        <a href="#accounts" class="nav-item" data-page="accounts">
          <span class="nav-icon">◎</span><span>Tài khoản</span>
        </a>
        <a href="#transactions" class="nav-item" data-page="transactions">
          <span class="nav-icon">⇄</span><span>Thu chi</span>
        </a>
        <a href="#debts" class="nav-item" data-page="debts">
          <span class="nav-icon">↓</span><span>Nợ phải trả</span>
        </a>
        <a href="#loans" class="nav-item" data-page="loans">
          <span class="nav-icon">↑</span><span>Vay & Cho vay</span>
        </a>
        <a href="#funds" class="nav-item" data-page="funds">
          <span class="nav-icon">◈</span><span>Quỹ</span>
        </a>
        <a href="#projections" class="nav-item" data-page="projections">
          <span class="nav-icon">◷</span><span>Dự kiến</span>
        </a>
        <a href="#reports" class="nav-item" data-page="reports">
          <span class="nav-icon">▥</span><span>Báo cáo</span>
        </a>
        <a href="#audit" class="nav-item" data-page="audit">
          <span class="nav-icon">☰</span><span>Lịch sử</span>
        </a>
        <a href="#settings" class="nav-item" data-page="settings">
          <span class="nav-icon">⚙</span><span>Cài đặt</span>
        </a>
      </nav>
      <div class="sidebar-footer">
        <div class="net-worth-mini" id="sidebar-net-worth">
          <span class="label">Tài sản ròng</span>
          <span class="value">0 ₫</span>
        </div>
      </div>
    </aside>

    <main id="main" class="main">
      <header class="topbar">
        <div class="topbar-left">
          <button id="mobile-menu-btn" class="icon-btn mobile-only">☰</button>
          <h1 id="page-title">Tổng quan</h1>
        </div>
        <div class="topbar-right">
          <button id="btn-quick-add" class="btn btn-primary btn-sm">+ Thêm nhanh</button>
          <button id="btn-backup" class="btn btn-ghost btn-sm" title="Sao lưu">Sao lưu</button>
        </div>
      </header>
      <div id="page-content" class="page-content"></div>
    </main>
  </div>

  <div id="modal-root"></div>
  <div id="toast-container"></div>

  <script src="js/db.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/interest.js"></script>
  <script src="js/services.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/pages/dashboard.js"></script>
  <script src="js/pages/accounts.js"></script>
  <script src="js/pages/transactions.js"></script>
  <script src="js/pages/debts.js"></script>
  <script src="js/pages/loans.js"></script>
  <script src="js/pages/funds.js"></script>
  <script src="js/pages/projections.js"></script>
  <script src="js/pages/reports.js"></script>
  <script src="js/pages/audit.js"></script>
  <script src="js/pages/settings.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
